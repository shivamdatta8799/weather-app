<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="mainBox mainBox1">
      <img src="logo.png" alt="" />
      <h1 class="waether">Weather</h1>
      <h2 class="ForeCasts">ForeCasts</h2>
      <button class="start">Get Start</button>
    </div>

    <div class="mainBox mainBox2 inactive">
      <div class="searchbox">
        <input type="text" placeholder="Enter Your City" id="inputfield" />

        <div class="img">
          <img src="magnifying-glass-solid-full.svg" id="searchicon" />
        </div>
      </div>
      <div class="iconBox">
        <img src="sunimage.png" alt="" id="icon" />
        <p id="desc">Description</p>
      </div>
      <div class="tempBox">
        <h1 id="temp">0&deg;C.</h1>
        <h3 id="City">New York</h3>
      </div>
      <div class="extraDetails">
        <div class="wind">
          <img src="wind-solid-full.svg" id="windIcon" />
          <div class="windData">
            <p id="windspeed">0km/h</p>
            <p>wind</p>
          </div>
        </div>
        <div class="humdity">
          <img src="humidity.png" id="humidityicon" />
          <div class="humidityData">
            <p id="humidityspeed">0%</p>
            <p>humidity</p>
          </div>
        </div>
      </div>
    </div>

    <div class="mainBox mainBox3 inactive">
      <h1>404</h1>
      <p>Ooops! Page Not Found</p>
      <p id="info">
        The Page you're looking for doesn't exist or has been moved
      </p>
      <button class="homebtn">GO HOME</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
